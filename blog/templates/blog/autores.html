{% extends 'blog/base.html' %}
{% block titulo %}Autores{% endblock %}

{% block contenido %}
    <ul>
    {% for autor in autores %}
        <li>
            <a href="{% url 'entradas_autor' autor=autor%}">
            {{ autor }}
            </a>
        </li>
    {% empty %}
        <li>No hay autores.</li>
    {% endfor %}
    </ul>

<a href="{% url 'principal' %}">Volver a la página principal</a>
{% endblock %}
