<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Principal</title>
</head>
<body>
    <h2>¡Hola, esta es mi primera página en DJango!</h2>
    <p>Hola esto es de programar en DJango.</p>
        {{titulo}} | {{autor}} | {{cuerpo}}
    <ul>
        {% for post in posts %}
            <li><a href="{% url 'detalle_post' pk=post.pk %}">{{ post.titulo }} | {{ post.autor }} | {{ post.cuerpo }}</a></li>
        {% endfor %}
    </ul>

</body>
</html>
